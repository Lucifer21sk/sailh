<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hockey Squad Builder</title>
    <!-- Load pure Pyodide directly -->
    <script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        h1 { color: #1e5fbf; margin-bottom: 5px; }
        #loading { font-size: 18px; font-weight: bold; color: #d9534f; margin: 20px; padding: 20px; background: white; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        #app { display: none; display: flex; flex-direction: column; align-items: center; width: 100%; }
        .controls { margin-bottom: 15px; background: white; padding: 10px 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        canvas { background: white; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.15); cursor: pointer; }
        .btn-group { margin-top: 15px; }
        button, label { font-size: 14px; font-weight: bold; margin-right: 10px; cursor: pointer; }
        button { padding: 8px 16px; background-color: #1e5fbf; color: white; border: none; border-radius: 4px; }
        button:hover { background-color: #154693; }
        .hint { color: #666; font-style: italic; font-size: 13px; margin-left: 15px; }
    </style>
</head>
<body>

    <h1>Hockey Squad Builder</h1>
    
    <div id="loading">Loading Python Engine and Packages... Please wait.</div>

    <div id="app">
        <div class="controls">
            <label>Mode:</label>
            <input type="radio" id="mode_ice" name="rink_mode" value="ICE" checked>
            <label for="mode_ice" style="font-weight:normal;">Ice Hockey</label>
            
            <input type="radio" id="mode_inline" name="rink_mode" value="INLINE">
            <label for="mode_inline" style="font-weight:normal;">Inline Hockey</label>
            
            <span class="hint">Click a player icon on the canvas to edit their name</span>
        </div>

        <canvas id="rinkCanvas" width="1000" height="560"></canvas>

        <div class="btn-group">
            <button id="save_btn">Save as PNG</button>
            <button id="clear_btn" style="background-color: #d9534f;">Clear Squad</button>
        </div>
    </div>

    <script>
        async function main() {
            let out = document.getElementById("loading");
            
            // 1. Initialize Pyodide
            out.innerText = "1/4: Booting Python Engine...";
            let pyodide = await loadPyodide();
            
            // 2. Install Pillow
            out.innerText = "2/4: Installing Image Libraries (Pillow)...";
            await pyodide.loadPackage("micropip"); 
            await pyodide.loadPackage("pillow");

            // 3. Fetch images 
            out.innerText = "3/4: Fetching Player Icons...";
            const imageFiles = ["ice.jpg", "roller.jpg", "keeper.jpg"];
            for (let file of imageFiles) {
                try {
                    let response = await fetch(file);
                    if (response.ok) {
                        let buffer = await response.arrayBuffer();
                        pyodide.FS.writeFile(file, new Uint8Array(buffer));
                    }
                } catch (e) {
                    console.log("Could not load image: " + file);
                }
            }

            // 4. Fetch a TrueType Font from a public CDN for bigger text
            out.innerText = "4/4: Fetching Fonts...";
            try {
                let fontResponse = await fetch("https://cdn.jsdelivr.net/npm/roboto-font@0.1.0/fonts/Roboto/roboto-bold-webfont.ttf");
                if (fontResponse.ok) {
                    let fontBuffer = await fontResponse.arrayBuffer();
                    pyodide.FS.writeFile("bold_font.ttf", new Uint8Array(fontBuffer));
                }
            } catch (e) {
                console.log("Could not load font file.");
            }

            // Hide loading, show app UI
            out.style.display = "none";
            document.getElementById("app").style.display = "flex";

            // Run the translated Python script
            await pyodide.runPythonAsync(`
import js
import io
import base64
import os
from pyodide.ffi import create_proxy
from PIL import Image, ImageDraw, ImageFont

CANVAS_W, CANVAS_H = 1000, 560
RINK_X0, RINK_Y0, RINK_X1, RINK_Y1 = 50, 110, 950, 470
RINK_CX = (RINK_X0 + RINK_X1) / 2
RINK_CY = (RINK_Y0 + RINK_Y1) / 2
RINK_W = RINK_X1 - RINK_X0

GOAL_LEFT_X = RINK_X0 + 0.09 * RINK_W
GOAL_RIGHT_X = RINK_X1 - 0.09 * RINK_W
BLUE_LEFT_X = RINK_X0 + 0.30 * RINK_W
BLUE_RIGHT_X = RINK_X1 - 0.30 * RINK_W
FACEOFF_LEFT_X = GOAL_LEFT_X + 0.11 * RINK_W
FACEOFF_RIGHT_X = GOAL_RIGHT_X - 0.11 * RINK_W

ICON_SIZE = (54, 50)
DEF_COL_X = FACEOFF_LEFT_X + 62
FWD_COL_X = BLUE_LEFT_X + 65

ICE_POSITIONS = [
    {"key": "G",  "label": "G",  "x": GOAL_LEFT_X,  "y": RINK_CY},
    {"key": "LD", "label": "LD", "x": DEF_COL_X,     "y": RINK_CY - 75},
    {"key": "RD", "label": "RD", "x": DEF_COL_X,     "y": RINK_CY + 75},
    {"key": "LW", "label": "LW", "x": FWD_COL_X,     "y": RINK_CY - 118},
    {"key": "C",  "label": "C",  "x": FWD_COL_X,     "y": RINK_CY},
    {"key": "RW", "label": "RW", "x": FWD_COL_X,     "y": RINK_CY + 118},
]

INLINE_POSITIONS = [
    {"key": "G",  "label": "G",  "x": GOAL_LEFT_X,  "y": RINK_CY},
    {"key": "LD", "label": "LD", "x": DEF_COL_X,     "y": RINK_CY - 75},
    {"key": "RD", "label": "RD", "x": DEF_COL_X,     "y": RINK_CY + 75},
    {"key": "LW", "label": "LW", "x": FWD_COL_X,     "y": RINK_CY - 105},
    {"key": "RW", "label": "RW", "x": FWD_COL_X,     "y": RINK_CY + 105},
]

MODE_INFO = {
    "ICE": {"positions": ICE_POSITIONS},
    "INLINE": {"positions": INLINE_POSITIONS},
}

squads = {
    "ICE": {p["key"]: {"name": ""} for p in ICE_POSITIONS},
    "INLINE": {p["key"]: {"name": ""} for p in INLINE_POSITIONS},
}

# Load the downloaded font, with a fallback if it fails
try:
    FONT_LABEL = ImageFont.truetype("bold_font.ttf", 14) # Position Size
    FONT_NAME = ImageFont.truetype("bold_font.ttf", 22)  # Player Name Size
    FONT_HINT = ImageFont.truetype("bold_font.ttf", 14)  # '+ Add' Text Size
except Exception:
    FONT_LABEL = ImageFont.load_default()
    FONT_NAME = ImageFont.load_default()
    FONT_HINT = ImageFont.load_default()

def get_current_mode():
    return "INLINE" if js.document.getElementById("mode_inline").checked else "ICE"

def get_icon(is_goalie):
    mode = get_current_mode()
    path = "keeper.jpg" if is_goalie else ("ice.jpg" if mode == "ICE" else "roller.jpg")
    
    if os.path.exists(path):
        try:
            source = Image.open(path).convert("RGBA")
            source.thumbnail(ICON_SIZE, Image.LANCZOS)
            return source
        except Exception:
            pass
            
    color = (180, 40, 40, 255) if is_goalie else ((30, 95, 191, 255) if mode == "ICE" else (70, 70, 70, 255))
    return Image.new("RGBA", ICON_SIZE, color)

def draw_ice_rink(draw):
    draw.rounded_rectangle([RINK_X0, RINK_Y0, RINK_X1, RINK_Y1], radius=70, outline="#c62828", width=4)
    draw.line([GOAL_LEFT_X, RINK_Y0 + 6, GOAL_LEFT_X, RINK_Y1 - 6], fill="#c62828", width=3)
    draw.line([GOAL_RIGHT_X, RINK_Y0 + 6, GOAL_RIGHT_X, RINK_Y1 - 6], fill="#c62828", width=3)
    draw.line([BLUE_LEFT_X, RINK_Y0 + 4, BLUE_LEFT_X, RINK_Y1 - 4], fill="#1e5fbf", width=5)
    draw.line([BLUE_RIGHT_X, RINK_Y0 + 4, BLUE_RIGHT_X, RINK_Y1 - 4], fill="#1e5fbf", width=5)
    draw.line([RINK_CX, RINK_Y0 + 4, RINK_CX, RINK_Y1 - 4], fill="#c62828", width=3)

    r = 55
    draw.ellipse([RINK_CX - r, RINK_CY - r, RINK_CX + r, RINK_CY + r], outline="#1e5fbf", width=2)
    draw.ellipse([RINK_CX - 3, RINK_CY - 3, RINK_CX + 3, RINK_CY + 3], fill="#1e5fbf")

    fr = 28
    for fx in (FACEOFF_LEFT_X, FACEOFF_RIGHT_X):
        for fy in (RINK_CY - 90, RINK_CY + 90):
            draw.ellipse([fx - fr, fy - fr, fx + fr, fy + fr], outline="#c62828", width=2)
            draw.ellipse([fx - 3, fy - 3, fx + 3, fy + 3], fill="#c62828")

    cr = 34
    draw.arc([GOAL_LEFT_X - cr, RINK_CY - cr, GOAL_LEFT_X + cr, RINK_CY + cr], start=-90, end=90, fill="#1e5fbf", width=3)
    draw.line([GOAL_LEFT_X, RINK_CY - cr, GOAL_LEFT_X, RINK_CY + cr], fill="#1e5fbf", width=3)
    draw.arc([GOAL_RIGHT_X - cr, RINK_CY - cr, GOAL_RIGHT_X + cr, RINK_CY + cr], start=90, end=270, fill="#1e5fbf", width=3)
    draw.line([GOAL_RIGHT_X, RINK_CY - cr, GOAL_RIGHT_X, RINK_CY + cr], fill="#1e5fbf", width=3)

def draw_inline_rink(draw):
    draw.rounded_rectangle([RINK_X0, RINK_Y0, RINK_X1, RINK_Y1], radius=35, outline="black", width=4)
    y0, y1, x = RINK_Y0 + 6, RINK_Y1 - 6, RINK_CX
    dash, gap = 10, 7
    y = y0
    while y < y1:
        draw.line([x, y, x, min(y + dash, y1)], fill="black", width=2)
        y += dash + gap
    draw.ellipse([RINK_CX - 4, RINK_CY - 4, RINK_CX + 4, RINK_CY + 4], fill="black")

    cr = 32
    draw.arc([GOAL_LEFT_X - cr, RINK_CY - cr, GOAL_LEFT_X + cr, RINK_CY + cr], start=-90, end=90, fill="black", width=3)
    draw.line([GOAL_LEFT_X, RINK_CY - cr, GOAL_LEFT_X, RINK_CY + cr], fill="black", width=3)
    draw.arc([GOAL_RIGHT_X - cr, RINK_CY - cr, GOAL_RIGHT_X + cr, RINK_CY + cr], start=90, end=270, fill="black", width=3)
    draw.line([GOAL_RIGHT_X, RINK_CY - cr, GOAL_RIGHT_X, RINK_CY + cr], fill="black", width=3)

def centered_text(draw, cx, cy, text, font, fill):
    try:
        bb = draw.textbbox((0, 0), text, font=font)
        w, h = bb[2] - bb[0], bb[3] - bb[1]
    except Exception:
        w, h = len(text) * 6, 12
    x = cx - w / 2
    y = cy - h / 2
    padding = 4
    draw.rectangle([x - padding, y - padding, x + w + padding, y + h + padding], fill="white")
    draw.text((x, y), text, font=font, fill=fill)

def build_image():
    img = Image.new("RGB", (CANVAS_W, CANVAS_H), "white")
    draw = ImageDraw.Draw(img)

    if get_current_mode() == "ICE":
        draw_ice_rink(draw)
    else:
        draw_inline_rink(draw)

    squad = squads[get_current_mode()]
    positions = MODE_INFO[get_current_mode()]["positions"]

    for pos in positions:
        is_goalie = (pos["key"] == "G")
        icon = get_icon(is_goalie)
        x, y = pos["x"], pos["y"]
        iw, ih = icon.size
        filled = bool(squad[pos["key"]]["name"])

        used_icon = icon if filled else Image.blend(Image.new("RGBA", icon.size, (255, 255, 255, 255)), icon, 0.45)
        img.paste(used_icon, (int(x - iw / 2), int(y - ih / 2)), used_icon)

        # FIX: Label goes ABOVE the icon
        centered_text(draw, x, y - ih / 2 - 14, pos["label"], FONT_LABEL, "gray")
        
        # FIX: Player Name (or Add button) goes BELOW the icon
        if filled:
            centered_text(draw, x, y + ih / 2 + 18, squad[pos["key"]]["name"], FONT_NAME, "black")
        else:
            centered_text(draw, x, y + ih / 2 + 18, "+ Add", FONT_HINT, "#999999")

    return img

def render_canvas():
    img = build_image()
    buf = io.BytesIO()
    img.save(buf, format="PNG")
    b64_str = base64.b64encode(buf.getvalue()).decode("utf-8")
    
    canvas = js.document.getElementById("rinkCanvas")
    ctx = canvas.getContext("2d")
    image_obj = js.window.Image.new()
    
    def on_load(evt):
        ctx.clearRect(0, 0, CANVAS_W, CANVAS_H)
        ctx.drawImage(image_obj, 0, 0)
    
    image_obj.onload = create_proxy(on_load)
    image_obj.src = "data:image/png;base64," + b64_str

def handle_canvas_click(event):
    rect = js.document.getElementById("rinkCanvas").getBoundingClientRect()
    click_x = event.clientX - rect.left
    click_y = event.clientY - rect.top

    iw, ih = ICON_SIZE
    pad = 20
    positions = MODE_INFO[get_current_mode()]["positions"]
    squad = squads[get_current_mode()]

    for pos in positions:
        x, y = pos["x"], pos["y"]
        # Click zone spans from the top label to the bottom name
        x0, y0 = x - iw / 2 - pad, y - ih / 2 - pad - 14 
        x1, y1 = x + iw / 2 + pad, y + ih / 2 + pad + 18
        if x0 <= click_x <= x1 and y0 <= click_y <= y1:
            key, label = pos["key"], pos["label"]
            current_name = squad[key]["name"]
            
            new_name = js.window.prompt(f"Enter player name for {label}:", current_name)
            if new_name is not None:
                squad[key]["name"] = new_name.strip()
                render_canvas()
            break

def save_png_click(event):
    img = build_image()
    buf = io.BytesIO()
    img.save(buf, format="PNG")
    b64 = base64.b64encode(buf.getvalue()).decode("utf-8")
    
    link = js.document.createElement("a")
    link.href = "data:image/png;base64," + b64
    link.download = "hockey_squad.png"
    js.document.body.appendChild(link)
    link.click()
    js.document.body.removeChild(link)

def clear_squad_click(event):
    mode = get_current_mode()
    if js.window.confirm(f"Clear the current {mode} squad?"):
        squad = squads[mode]
        for key in squad:
            squad[key]["name"] = ""
        render_canvas()

js.document.getElementById("rinkCanvas").addEventListener("click", create_proxy(handle_canvas_click))
js.document.getElementById("save_btn").addEventListener("click", create_proxy(save_png_click))
js.document.getElementById("clear_btn").addEventListener("click", create_proxy(clear_squad_click))
js.document.getElementById("mode_ice").addEventListener("change", create_proxy(lambda e: render_canvas()))
js.document.getElementById("mode_inline").addEventListener("change", create_proxy(lambda e: render_canvas()))

render_canvas()
            `);
        }
        main();
    </script>
</body>
</html>
